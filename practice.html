<section>
<h2>Day 1: Package and serve</h2>
<ol>
<li><p>A colleague exports a churn model as model.skops, signature.json and requirements.txt with exact pins. A clean environment loads it and reproduces 7 of 10 reference predictions. The notebook ranked customers and called the top 5% at risk. What is missing?</p><ul><li><b>A.</b> A safer format than skops</li><li><b>B.</b> Looser pins, so that the newest versions install</li><li><b>C.</b> The decision rule: the top-5% cut-off that turned scores into labels</li><li><b>D.</b> Twenty reference predictions instead of ten</li></ul></li>
<li><p>Adel retrains Farz 1.0.0 with the same code on one more month of claims. Production names farz 1.0.0 in its manifest. What should be registered?</p><ul><li><b>A.</b> A new version, 1.0.1 or 1.1.0, with the new data hash, while production keeps 1.0.0</li><li><b>B.</b> The new file as 1.0.0, so production picks it up</li><li><b>C.</b> Nothing: the code did not change</li><li><b>D.</b> Move the champion alias to the new file</li></ul></li>
<li><p>The claims system starts sending "fraud_flag": true with some claims. Farz's contract does not list the field. What should the service do?</p><ul><li><b>A.</b> Ignore the field and triage the claim</li><li><b>B.</b> Pass it to the model as an eleventh feature</li><li><b>C.</b> Answer 500, prediction-failed</li><li><b>D.</b> Answer 422, validation-error, naming fraud_flag</li></ul></li>
<li><p>A new Farz pod starts, but its model file was copied incompletely. The process is running and answers HTTP. What should /livez and /readyz answer?</p><ul><li><b>A.</b> /livez 503, /readyz 503</li><li><b>B.</b> /livez 200, /readyz 503 with the reason</li><li><b>C.</b> /livez 200, /readyz 200, then 503 on each prediction</li><li><b>D.</b> /livez 503, /readyz 200</li></ul></li>
<li><p>An auditor asks which model scored a disputed claim last March and whether it can be loaded today. Which component of the deployment path answers both questions?</p><ul><li><b>A.</b> The container image, because it holds the model file</li><li><b>B.</b> The monitor, because it recorded every request</li><li><b>C.</b> The model registry, through the version named in the response</li><li><b>D.</b> The endpoint, because its path is /v1/</li></ul></li>
<li><p>An artefact folder holds model.skops, signature.json and metadata.json. A fresh environment installs the newest scikit-learn and the reference predictions differ. What should the export have added?</p><ul><li><b>A.</b> A requirements file with the exact versions that wrote the model</li><li><b>B.</b> A pickle copy of the model as a fallback</li><li><b>C.</b> A larger set of reference predictions</li><li><b>D.</b> The project lock file of the training repository</li></ul></li>
<li><p>A partner sends a model as a pickle file by email. You need it in Rifd's registry. What is the safe first step?</p><ul><li><b>A.</b> Load it in the service and convert it there</li><li><b>B.</b> Rename it to .skops</li><li><b>C.</b> Register the pickle as it is; the registry checks the sha256</li><li><b>D.</b> Ask the partner to export it in a format that loads no code, or load it once in an isolated environment after reading what it imports</li></ul></li>
<li><p>Production runs farz 1.0.0. A colleague finds a bug in the export (the decision rule was missing) and wants to fix the files of 1.0.0 in the registry. What should happen?</p><ul><li><b>A.</b> Overwrite 1.0.0, since the model weights did not change</li><li><b>B.</b> Register the fixed export as a new version and release it</li><li><b>C.</b> Move the champion alias to the fixed folder</li><li><b>D.</b> Edit metadata.json in place, since only metadata changes</li></ul></li>
<li><p>Why does the Farz artefact store ten reference inputs with the predictions the notebook made for them?</p><ul><li><b>A.</b> To give the API documentation examples</li><li><b>B.</b> To warm up the model for speed only</li><li><b>C.</b> To prove, in any environment, that the artefact behaves as the notebook did</li><li><b>D.</b> To measure the model's accuracy</li></ul></li>
<li><p>The claims system receives a 422 validation-error for one claim and a 503 model-unavailable for another. What should it do?</p><ul><li><b>A.</b> Fix and resend the first; retry the second later or route it to manual triage</li><li><b>B.</b> Retry both after a delay</li><li><b>C.</b> Send both to manual triage</li><li><b>D.</b> Treat both as service failures and alert</li></ul></li>
<li><p>The contract lists no field called channel_detail, and a caller starts sending it. The schema uses extra="forbid". What does the caller receive?</p><ul><li><b>A.</b> 200, with the field ignored</li><li><b>B.</b> 500 prediction-failed</li><li><b>C.</b> 400 with a plain text message</li><li><b>D.</b> 422 validation-error naming channel_detail</li></ul></li>
<li><p>The policy lookup that some health claims need is down. Should Farz's /livez, /readyz, or neither, report it?</p><ul><li><b>A.</b> /livez, so that the pod restarts</li><li><b>B.</b> Neither: answer the affected claims with dependency-failed and alert on its rate</li><li><b>C.</b> /readyz, so that every pod leaves the service</li><li><b>D.</b> Both, to be safe</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Containers and a cluster</h2>
<ol>
<li><p>A container file copies pyproject.toml and uv.lock, runs uv sync --no-install-project, copies src, and runs uv sync again. A colleague edits one function in src/rifd/app.py and rebuilds. What runs again?</p><ul><li><b>A.</b> Every line, from the base image down</li><li><b>B.</b> The copy of src and the second uv sync, which installs only the project</li><li><b>C.</b> The first uv sync, because the dependencies must be checked</li><li><b>D.</b> Nothing, because the dependencies did not change</li></ul></li>
<li><p>A scan of the fraud-review image reports: high, in the HTTP parser, fixed in the next version; critical, in an image library the service never imports, no fix; medium, in the base image, fixed by a newer base. Where do you start?</p><ul><li><b>A.</b> The critical one, because it is critical</li><li><b>B.</b> The medium one, because a new base is the easiest change</li><li><b>C.</b> Suppress all three and scan again next quarter</li><li><b>D.</b> The high one in the HTTP parser: it is reachable by every request and has a fix</li></ul></li>
<li><p>A Farz pod shows Running with 0/1 ready. Its events repeat "Readiness probe failed: HTTP probe failed with statuscode: 503". The pod has never restarted. What is the most likely cause?</p><ul><li><b>A.</b> The model did not load, so /readyz answers model-unavailable</li><li><b>B.</b> The image tag cannot be pulled</li><li><b>C.</b> The memory limit is too low</li><li><b>D.</b> The liveness probe path is wrong</li></ul></li>
<li><p>Shabih needs about 40 MiB more memory than Farz and loads ten times slower. Searches peak in the afternoon, when adjusters work; new claims arrive all day. The team wants to put both models in one pod to save a deployment. What do you advise?</p><ul><li><b>A.</b> One pod with both models: fewer things to run</li><li><b>B.</b> Two images, because the models differ</li><li><b>C.</b> One image, two deployments, each with its own limits, startup probe and replica count</li><li><b>D.</b> Run Shabih as a nightly batch instead of a service</li></ul></li>
<li><p>In the path artefact, registry, image, runtime, endpoint, monitor: which component restarts the service when its process stops answering?</p><ul><li><b>A.</b> The runtime, the cluster acting on the liveness probe</li><li><b>B.</b> The registry</li><li><b>C.</b> The image</li><li><b>D.</b> The monitor</li></ul></li>
<li><p>A colleague says the registry and the container image do the same job, since both store the model. What does the image add that the registry does not?</p><ul><li><b>A.</b> The model version history</li><li><b>B.</b> The code, the libraries and the runtime settings that serve the model, in one package the cluster can run</li><li><b>C.</b> The training data</li><li><b>D.</b> The latency objective</li></ul></li>
<li><p>Shabih returns past claims similar to a description. Which response field would break the contract Bassam signed?</p><ul><li><b>A.</b> claim_id of each neighbour</li><li><b>B.</b> the incident type of each neighbour</li><li><b>C.</b> the member name of each neighbour</li><li><b>D.</b> the similarity score</li></ul></li>
<li><p>A container file copies the whole project, then runs uv sync. Every code change reinstalls all dependencies. What fixes it?</p><ul><li><b>A.</b> Copy pyproject.toml and uv.lock first, sync, then copy the code</li><li><b>B.</b> Use a larger base image with the libraries already in it</li><li><b>C.</b> Disable the build cache</li><li><b>D.</b> Install with pip instead of uv</li></ul></li>
<li><p>What does the second stage of Farz's multi-stage container file leave out that the naive file kept?</p><ul><li><b>A.</b> The model files</li><li><b>B.</b> The non-root user</li><li><b>C.</b> The Python interpreter</li><li><b>D.</b> The build tools, the development dependencies and the files the service does not read</li></ul></li>
<li><p>A scan reports a critical finding in h11 0.14.0 with fixed version 0.16.0, and a medium finding in the base image with no fix available. What do you do first?</p><ul><li><b>A.</b> Change the base image to a different distribution</li><li><b>B.</b> Raise the h11 pin to a fixed version, rebuild and scan again</li><li><b>C.</b> Ignore both, since the service is internal</li><li><b>D.</b> Suppress the critical finding in the scanner configuration</li></ul></li>
<li><p>A container file sets ENV RIFD_LOOKUP_KEY=... in the image. After removing the line, the team rebuilds and pushes. Is the key still exposed?</p><ul><li><b>A.</b> No, the line is gone</li><li><b>B.</b> Only if the registry is public</li><li><b>C.</b> Yes, in every earlier image that was pushed; the key must also be rotated</li><li><b>D.</b> Only in the build cache of the laptop</li></ul></li>
<li><p>On a kind cluster, pods of rifd/claims:latest stay in ErrImagePull although the image was loaded into the cluster. What is the likely cause?</p><ul><li><b>A.</b> imagePullPolicy Always with the tag latest makes the node pull from a registry that does not have the image</li><li><b>B.</b> The readiness probe path is wrong</li><li><b>C.</b> The memory limit is too low</li><li><b>D.</b> The Service selector does not match</li></ul></li>
<li><p>A pod requests 256Mi of memory with a limit of 512Mi, and grows to 600Mi under load. What happens?</p><ul><li><b>A.</b> Nothing, the request is only a hint</li><li><b>B.</b> It is throttled until memory falls</li><li><b>C.</b> The scheduler moves it to a bigger node</li><li><b>D.</b> The container is killed for exceeding its memory limit and restarted</li></ul></li>
<li><p>Rifd classifies claims with personal and health data as Restricted and keeps Restricted data on in-Kingdom hosting. Where may the dashboards of request counts, latency and label shares run?</p><ul><li><b>A.</b> Only beside Farz, because they describe Farz</li><li><b>B.</b> On the monitoring service outside the Kingdom, provided the metrics and logs sent there carry no personal data and Rifd's owners approve it</li><li><b>C.</b> Nowhere: dashboards are not allowed for Restricted services</li><li><b>D.</b> Anywhere, since metrics are never personal data</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Observe and size</h2>
<ol>
<li><p>Farz runs four replicas. Each exposes its latency histogram. The dashboard must show the 95th percentile of all triage requests in the last minute. Which query is right?</p><ul><li><b>A.</b> avg of histogram_quantile(0.95, …) computed for each replica</li><li><b>B.</b> max of histogram_quantile(0.95, …) over the replicas</li><li><b>C.</b> rate of the duration sum divided by the rate of the count</li><li><b>D.</b> histogram_quantile(0.95, sum by (le) (rate(…_bucket[1m])))</li></ul></li>
<li><p>The fraud-review service logs each request body at debug level, and the log search tool hides the national id field in its display. A colleague says that is enough. What do you answer?</p><ul><li><b>A.</b> It is enough while debug logging stays off in production</li><li><b>B.</b> It is enough, because nobody sees the field</li><li><b>C.</b> It is not: the id is already stored; stop logging the body and test that no id reaches a log</li><li><b>D.</b> Encrypt the log store and keep logging the body</li></ul></li>
<li><p>A team load-tests the fraud-review service with 50 users, each sending the next request when the last answer arrives. The 95th percentile stays at 40 ms while the service's own histogram shows 400 ms in the same minute. What explains it?</p><ul><li><b>A.</b> A closed load: users waited for slow answers, so fewer requests were sent and timed exactly when it slowed</li><li><b>B.</b> The network between the test and the service</li><li><b>C.</b> The test had no warm-up</li><li><b>D.</b> The histogram buckets are too wide</li></ul></li>
<li><p>One replica of the fraud-review service holds its objective up to 60 requests a second. The target is 150 a second. The team plans 20% headroom and one spare replica. How many replicas does it need?</p><ul><li><b>A.</b> 4</li><li><b>B.</b> 5</li><li><b>C.</b> 6</li><li><b>D.</b> 3</li></ul></li>
<li><p>Farz answers every request with status 200 and a fast latency, but its share of investigate labels has doubled since a release. Which component of the path should have shown this first?</p><ul><li><b>A.</b> The image scan</li><li><b>B.</b> The endpoint, through its contract tests</li><li><b>C.</b> The registry, through the version metrics</li><li><b>D.</b> The monitor, through the prediction distribution panel</li></ul></li>
<li><p>Farz has four replicas. Why does it record latency as a histogram rather than computing the 95th percentile in each process?</p><ul><li><b>A.</b> Histograms are smaller to store</li><li><b>B.</b> A histogram gives the exact 95th percentile</li><li><b>C.</b> Bucket counts can be added across replicas, and the 95th percentile of the sum estimated; percentiles of each process cannot be averaged</li><li><b>D.</b> Prometheus cannot store numbers below one</li></ul></li>
<li><p>Farz's latency objective is 150 ms. Its histogram buckets are 0.1, 0.5 and 1 second. What is the problem?</p><ul><li><b>A.</b> No bucket boundary lies near 150 ms, so the estimated 95th percentile there is a straight-line guess between 100 and 500 ms</li><li><b>B.</b> There are too few buckets to store</li><li><b>C.</b> Buckets must be powers of two</li><li><b>D.</b> Histograms need a bucket at zero</li></ul></li>
<li><p>Where should Farz remove the member's national id so that no log line or span carries it?</p><ul><li><b>A.</b> In the dashboard query, by hiding the field</li><li><b>B.</b> In the log storage, with a retention rule</li><li><b>C.</b> In the claims system, by not sending it</li><li><b>D.</b> At the service edge: never pass it to the model, never log the claim body, and redact in the logger as a last defence</li></ul></li>
<li><p>A slow triage request shows a root span of 180 ms with two children: policy_lookup 121 ms and predict 1 ms. What should the team look at first?</p><ul><li><b>A.</b> The model: switch to a faster algorithm</li><li><b>B.</b> The policy lookup: cache it, call it less, or set a budget</li><li><b>C.</b> The network between the caller and Farz</li><li><b>D.</b> The logging configuration</li></ul></li>
<li><p>Why does Rifd keep its Farz dashboard as a JSON file in the repository rather than building it by hand in the tool?</p><ul><li><b>A.</b> It is reviewed, versioned and recreated with the service, and its queries can be tested against the metrics the service exposes</li><li><b>B.</b> The dashboard loads faster</li><li><b>C.</b> Dashboards built by hand cannot show percentiles</li><li><b>D.</b> The tool requires it</li></ul></li>
<li><p>A load test sends a new request only after the previous answer arrives. As the service slows down, what happens to the measured latency?</p><ul><li><b>A.</b> It rises faithfully with the slowdown</li><li><b>B.</b> It cannot be measured</li><li><b>C.</b> It is identical to an open load</li><li><b>D.</b> It looks better than real traffic would see, because the test sends fewer requests when the service is slow</li></ul></li>
<li><p>A load test sends the same motor claim 100 times a second and reports a 95th percentile of 9 ms. Live traffic shows 130 ms. What did the test miss?</p><ul><li><b>A.</b> The warm-up</li><li><b>B.</b> The mix of claims: health claims outside the network call the slow policy lookup</li><li><b>C.</b> The network</li><li><b>D.</b> A bigger machine</li></ul></li>
<li><p>One replica keeps the 95th percentile within the objective up to 150 requests a second. The target is 200, Rifd plans 30% headroom and one spare replica. How many replicas?</p><ul><li><b>A.</b> 2</li><li><b>B.</b> 4</li><li><b>C.</b> 3</li><li><b>D.</b> 1</li></ul></li>
<li><p>Three replicas cost SAR 0.6075 an hour and carry 200 predictions a second. What is the cost of 1,000 predictions?</p><ul><li><b>A.</b> About SAR 0.00084</li><li><b>B.</b> About SAR 0.0030</li><li><b>C.</b> About SAR 0.61</li><li><b>D.</b> About SAR 0.20</li></ul></li>
<li><p>Farz predicts in about one millisecond on a processor. A colleague proposes one graphics-processor replica to cut latency. What does the evidence say?</p><ul><li><b>A.</b> Do it: graphics processors are faster for every model</li><li><b>B.</b> Split the traffic between both</li><li><b>C.</b> Do it for the 99th percentile only</li><li><b>D.</b> Keep processors: the model is not the slow part, and the graphics replica costs far more per 1,000 predictions</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Release and watch</h2>
<ol>
<li><p>The fraud team has a new model that changes which claims are referred to investigators. The head of the team will not let any claim be referred by it until she has seen a week of its decisions on real claims. What do you propose?</p><ul><li><b>A.</b> A 10% canary for a week</li><li><b>B.</b> A rolling update with readiness probes</li><li><b>C.</b> A shadow release for a week: copy each request to it and keep only the current model's answer</li><li><b>D.</b> Blue-green with a switch back if anything looks wrong</li></ul></li>
<li><p>At 02:10 a canary has served 350 requests. Errors and latency are normal, but its investigate share is 14 points above the current version's. Munira's criteria say more than 10 points means roll back. Munira is asleep. What should the engineer do?</p><ul><li><b>A.</b> Set the canary's share to 0 now, then tell Munira with the evidence</li><li><b>B.</b> Wait for Munira to decide in the morning</li><li><b>C.</b> Keep the canary, since errors and latency are normal</li><li><b>D.</b> Find the cause first, then decide</li></ul></li>
<li><p>In week 3, the region mix has a PSI of 0.02. Customer age has a KS p-value of 0.001 and a PSI of 0.03. The channel has a PSI of 0.31. Labels for week 3 arrive in two weeks. Which summary is right?</p><ul><li><b>A.</b> Age and channel shifted; the model is degrading</li><li><b>B.</b> Channel shifted, so accuracy has fallen and the model must be retrained now</li><li><b>C.</b> Nothing shifted: two of three features are stable</li><li><b>D.</b> Channel shifted; age moved slightly and does not matter; accuracy is unknown until the labels arrive</li></ul></li>
<li><p>An alert on the 95th-percentile latency uses a 30-second rate window and no for: duration. It fires for a minute about twice a day and resolves by itself. Callers never complain. What is the best first change?</p><ul><li><b>A.</b> Raise the threshold to 300 ms</li><li><b>B.</b> Lengthen the window and add a for: duration, then test on a recording</li><li><b>C.</b> Send it to a wider group</li><li><b>D.</b> Delete the alert</li></ul></li>
<li><p>A new Farz version is trained. In which order does it pass through the path before a claim is triaged by it?</p><ul><li><b>A.</b> Image, registry, artefact, endpoint</li><li><b>B.</b> Registry, artefact, monitor, image</li><li><b>C.</b> Artefact, registry, image, runtime and endpoint, then the monitor watches it</li><li><b>D.</b> Endpoint, artefact, image, registry</li></ul></li>
<li><p>An alert on the 95th-percentile latency fires for one minute every few hours and resolves by itself. The on-call engineer has stopped looking at it. What is the first change?</p><ul><li><b>A.</b> Delete the alert</li><li><b>B.</b> Raise the threshold to twice the objective</li><li><b>C.</b> Add a for: duration and a longer rate window so that only a sustained breach fires</li><li><b>D.</b> Send it to more people</li></ul></li>
<li><p>A canary of farz 1.1.0 has served 160 requests with no errors and a slightly lower p95. Rifd's criteria say to judge only after 200 requests. What do you do?</p><ul><li><b>A.</b> Promote now, the numbers look good</li><li><b>B.</b> Keep the canary at 10% until it has served at least 200 requests, then apply the criteria</li><li><b>C.</b> Roll back to be safe</li><li><b>D.</b> Raise the canary to 50% to finish faster</li></ul></li>
<li><p>During a canary of farz 1.2.0 the investigate share rises from 19% to 41%. Who decides the rollback at Rifd, and who executes it?</p><ul><li><b>A.</b> The data scientist decides and executes</li><li><b>B.</b> The cluster decides automatically</li><li><b>C.</b> Munira Al-Ajmi decides; the on-call engineer executes, and rolls back first when a written criterion fires</li><li><b>D.</b> The adjusters decide by vote</li></ul></li>
<li><p>A new Farz version changes how claims are triaged. Munira wants evidence on real traffic before any claim is triaged by it. Which release strategy fits?</p><ul><li><b>A.</b> A shadow release: copy every request to the new version and keep only the current version's answer</li><li><b>B.</b> A rolling update</li><li><b>C.</b> A canary at 10%</li><li><b>D.</b> Blue-green with an immediate switch</li></ul></li>
<li><p>In week 3, policy tenure has a KS p-value of 0.04 and a PSI of 0.013, while the motor claim amounts have a PSI of 0.35. What should the drift report say?</p><ul><li><b>A.</b> Both features shifted: both are significant</li><li><b>B.</b> Only tenure: it has the smaller p-value</li><li><b>C.</b> Neither: p-values above 0.01 mean no drift</li><li><b>D.</b> Tenure moved slightly and does not matter; motor amounts shifted</li></ul></li>
<li><p>Over all claims, the amount has a PSI of 0.06 in week 4. By line, motor amounts have 0.29, health and property under 0.04. What does this show?</p><ul><li><b>A.</b> No drift, since 0.06 is below 0.1</li><li><b>B.</b> A shift in motor amounts that pooling over lines diluted</li><li><b>C.</b> A shift in every line</li><li><b>D.</b> A data error, since the numbers disagree</li></ul></li>
<li><p>Labels for a claim arrive about two weeks after it is filed. In week 4, what can Rifd conclude about concept drift for weeks 3 and 4?</p><ul><li><b>A.</b> That there is none, because accuracy in weeks 1 and 2 was stable</li><li><b>B.</b> That there is concept drift, because the inputs moved</li><li><b>C.</b> Nothing yet: the labels that would show it have not arrived; watch the inputs and predictions until they do</li><li><b>D.</b> That the model must be retrained now</li></ul></li>
</ol>
</section>
