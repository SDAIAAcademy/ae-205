<script type="application/json" id="academy-data">{"v":1,"engine":"1.0.0","build":{"at":"2026-11-15T09:27:24Z","version":"2027.1.0","commit":"fec8449"},"course":{"id":"ae-205","code":"AE-205","title":"Deploying AI Services: Containers, Serving and Monitoring","track":"ai-engineering","lang":"en","dir":"ltr","url":"https://sdaiaacademy.github.io/ae-205/","repo":"SDAIAAcademy/ae-205","home":"index.html","outcomes":[{"id":"LO1","text":"Explain the path from a trained model to a served prediction, naming the artefact, image, registry, runtime, endpoint and monitor at each step, given a deployment diagram with the components unlabelled"},{"id":"LO2","text":"Prepare a model artefact with pinned dependencies, a version, an input and output signature and a reproducible build, given a trained model and its training script"},{"id":"LO3","text":"Implement a versioned prediction API with input validation, typed errors and separate health and readiness checks, given the registered model and an API contract"},{"id":"LO4","text":"Configure a container image for the service, scan it for vulnerabilities and run it with resource limits on a single-node cluster, given the service code and a base image"},{"id":"LO5","text":"Implement metrics, structured logs and traces for the service and a dashboard for latency percentiles, error rate and prediction distribution, given the running service and a load generator"},{"id":"LO6","text":"Measure latency and throughput under load and size workers and replicas to meet a latency objective at the lowest cost, given a target request rate and a 95th-percentile latency objective set by the insurer, on laptop CPUs"},{"id":"LO7","text":"Deliver a new model version by canary release, decide on promotion or rollback from monitored metrics and detect drift in replayed traffic, given two model versions, four weeks of replayed claims with injected drift and written rollback criteria"}],"unit":"day","units":[{"n":1,"id":"day1","label":"Day 1","title":"Package and serve","sessions":[{"n":1,"label":"Session 1","title":"From notebook to artefact"},{"n":2,"label":"Session 2","title":"A registry for model versions"},{"n":3,"label":"Session 3","title":"A prediction API with a contract"},{"n":4,"label":"Session 4","title":"Health, readiness and warm-up"}]},{"n":2,"id":"day2","label":"Day 2","title":"Containers and a cluster","sessions":[{"n":1,"label":"Session 1","title":"Images that are small and reproducible"},{"n":2,"label":"Session 2","title":"Scanning and configuration"},{"n":3,"label":"Session 3","title":"Running on a local cluster"},{"n":4,"label":"Session 4","title":"Serving the embedding model"}]},{"n":3,"id":"day3","label":"Day 3","title":"Observe and size","sessions":[{"n":1,"label":"Session 1","title":"Metrics that matter"},{"n":2,"label":"Session 2","title":"Logs and traces"},{"n":3,"label":"Session 3","title":"Load testing"},{"n":4,"label":"Session 4","title":"Sizing and cost"}]},{"n":4,"id":"day4","label":"Day 4","title":"Release and watch","sessions":[{"n":1,"label":"Session 1","title":"Rolling, canary and shadow releases"},{"n":2,"label":"Session 2","title":"Rollback on evidence"},{"n":3,"label":"Session 3","title":"Drift in replayed traffic"},{"n":4,"label":"Session 4","title":"Alerts and a runbook"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone: a monitored service and its defence","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-artefact-q1","type":"single","prompt":"A colleague exports a churn model as model.skops, signature.json and requirements.txt with exact pins. A clean environment loads it and reproduces 7 of 10 reference predictions. The notebook ranked customers and called the top 5% at risk. What is missing?","options":[{"key":"A","text":"A safer format than skops"},{"key":"B","text":"Looser pins, so that the newest versions install"},{"key":"C","text":"The decision rule: the top-5% cut-off that turned scores into labels"},{"key":"D","text":"Twenty reference predictions instead of ten"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The model file holds the scores; the notebook's rule that turns them into labels is part of the model and belongs in the artefact.","misconceptions":["Blames the format: skops loads the same fitted pipeline the notebook had","The pins are exact and the environment loaded them: versions are not the difference","","More reference claims would show the same gap more precisely, not close it"],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-artefact","title":"What is missing from this artefact?"},"level":null,"pool":"checkpoint"},{"id":"check-registry-q1","type":"single","prompt":"Adel retrains Farz 1.0.0 with the same code on one more month of claims. Production names farz 1.0.0 in its manifest. What should be registered?","options":[{"key":"A","text":"A new version, 1.0.1 or 1.1.0, with the new data hash, while production keeps 1.0.0"},{"key":"B","text":"The new file as 1.0.0, so production picks it up"},{"key":"C","text":"Nothing: the code did not change"},{"key":"D","text":"Move the champion alias to the new file"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"New data makes a new model; a new model is a new version with its own evidence, released on purpose.","misconceptions":["","Treats a version as a slot to refresh: production would change model with no release","Thinks lineage is only about code: the data changed, so the model did","An alias move with no new version leaves no record of what the new file is"],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-registry","title":"Retrained on one more month"},"level":null,"pool":"checkpoint"},{"id":"check-contract-q1","type":"single","prompt":"The claims system starts sending \"fraud_flag\": true with some claims. Farz's contract does not list the field. What should the service do?","options":[{"key":"A","text":"Ignore the field and triage the claim"},{"key":"B","text":"Pass it to the model as an eleventh feature"},{"key":"C","text":"Answer 500, prediction-failed"},{"key":"D","text":"Answer 422, validation-error, naming fraud_flag"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The caller thinks the field matters; a validation error naming it starts the conversation about whether it should.","misconceptions":["Silently dropping it lets the caller believe the flag changed the triage","The model has no input for it: passing it on changes nothing and hides the gap","A 500 says the service broke, and the caller will retry the same claim",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-contract","title":"A claim with an extra field"},"level":null,"pool":"checkpoint"},{"id":"check-health-q1","type":"single","prompt":"A new Farz pod starts, but its model file was copied incompletely. The process is running and answers HTTP. What should /livez and /readyz answer?","options":[{"key":"A","text":"/livez 503, /readyz 503"},{"key":"B","text":"/livez 200, /readyz 503 with the reason"},{"key":"C","text":"/livez 200, /readyz 200, then 503 on each prediction"},{"key":"D","text":"/livez 503, /readyz 200"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The process is fine and the model is not: stop the traffic, keep the process, and say why.","misconceptions":["A liveness failure restarts the pod, and a restart cannot fix a bad file: a restart loop","","Ready with a bad model sends every claim to a service that cannot triage it","Readiness is the check that guards traffic; liveness failing alone would restart a pod that could not serve anyway"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-health","title":"Which check fails?"},"level":null,"pool":"checkpoint"},{"id":"check-layers-q1","type":"single","prompt":"A container file copies pyproject.toml and uv.lock, runs uv sync --no-install-project, copies src, and runs uv sync again. A colleague edits one function in src/rifd/app.py and rebuilds. What runs again?","options":[{"key":"A","text":"Every line, from the base image down"},{"key":"B","text":"The copy of src and the second uv sync, which installs only the project"},{"key":"C","text":"The first uv sync, because the dependencies must be checked"},{"key":"D","text":"Nothing, because the dependencies did not change"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A layer is reused while its line and the files it copies are unchanged; the first line whose input changed, and everything after it, runs again.","misconceptions":["Assumes any change invalidates the whole cache; the cache is per line, in order","","Thinks the lock is re-read on every build; it was not changed, so its layer is reused","Forgets that the copied code is part of the layer's key: a changed file invalidates it"],"lo":["LO4"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-layers","title":"What does this change rebuild?"},"level":null,"pool":"checkpoint"},{"id":"check-scan-q1","type":"single","prompt":"A scan of the fraud-review image reports: high, in the HTTP parser, fixed in the next version; critical, in an image library the service never imports, no fix; medium, in the base image, fixed by a newer base. Where do you start?","options":[{"key":"A","text":"The critical one, because it is critical"},{"key":"B","text":"The medium one, because a new base is the easiest change"},{"key":"C","text":"Suppress all three and scan again next quarter"},{"key":"D","text":"The high one in the HTTP parser: it is reachable by every request and has a fix"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Start with what an attacker can reach and you can fix; record the unfixable one with its reason, and take the new base next.","misconceptions":["Severity alone ignores that there is no fix and the code is never reached","The newer base is a fix in reach, but a reachable high finding matters more than a medium one","Suppressing hides findings without changing what runs",""],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-scan","title":"Which finding do you fix first?"},"level":null,"pool":"checkpoint"},{"id":"check-cluster-q1","type":"single","prompt":"A Farz pod shows Running with 0/1 ready. Its events repeat \"Readiness probe failed: HTTP probe failed with statuscode: 503\". The pod has never restarted. What is the most likely cause?","options":[{"key":"A","text":"The model did not load, so /readyz answers model-unavailable"},{"key":"B","text":"The image tag cannot be pulled"},{"key":"C","text":"The memory limit is too low"},{"key":"D","text":"The liveness probe path is wrong"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Running and never restarted rules out the image, memory and liveness; a 503 from the readiness check is the service saying it has no model.","misconceptions":["","An image problem stops the container before it runs; this pod is Running","A memory kill restarts the container; this pod has never restarted","A failing liveness probe restarts the container; the restart count is zero"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-cluster","title":"Why is this pod not ready?"},"level":null,"pool":"checkpoint"},{"id":"check-shabih-q1","type":"single","prompt":"Shabih needs about 40 MiB more memory than Farz and loads ten times slower. Searches peak in the afternoon, when adjusters work; new claims arrive all day. The team wants to put both models in one pod to save a deployment. What do you advise?","options":[{"key":"A","text":"One pod with both models: fewer things to run"},{"key":"B","text":"Two images, because the models differ"},{"key":"C","text":"One image, two deployments, each with its own limits, startup probe and replica count"},{"key":"D","text":"Run Shabih as a nightly batch instead of a service"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Separate deployments let each model have the memory, start-up budget, scaling and release it needs, while one image keeps the build single.","misconceptions":["Saving one manifest ties two release cycles and two scaling patterns together","The difference is in limits, probes and scaling, which the image does not decide","","An afternoon peak calls for scaling Shabih, not for running it at all hours only from a batch"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-shabih","title":"How should Shabih be deployed?"},"level":null,"pool":"checkpoint"},{"id":"check-metrics-q1","type":"single","prompt":"Farz runs four replicas. Each exposes its latency histogram. The dashboard must show the 95th percentile of all triage requests in the last minute. Which query is right?","options":[{"key":"A","text":"avg of histogram_quantile(0.95, …) computed for each replica"},{"key":"B","text":"max of histogram_quantile(0.95, …) over the replicas"},{"key":"C","text":"rate of the duration sum divided by the rate of the count"},{"key":"D","text":"histogram_quantile(0.95, sum by (le) (rate(…_bucket[1m])))"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Bucket counts add up across replicas, so sum the rates by boundary first and estimate the percentile once.","misconceptions":["Averaging four percentiles is not the percentile of the whole: a slow replica's tail is diluted","The largest of four percentiles overstates the service's percentile","The average of the observations hides the tail the objective is about",""],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-metrics","title":"How do you get the service's 95th percentile?"},"level":null,"pool":"checkpoint"},{"id":"check-logs-q1","type":"single","prompt":"The fraud-review service logs each request body at debug level, and the log search tool hides the national id field in its display. A colleague says that is enough. What do you answer?","options":[{"key":"A","text":"It is enough while debug logging stays off in production"},{"key":"B","text":"It is enough, because nobody sees the field"},{"key":"C","text":"It is not: the id is already stored; stop logging the body and test that no id reaches a log"},{"key":"D","text":"Encrypt the log store and keep logging the body"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Data that is never written cannot leak or be misused; a display filter acts after the copy exists.","misconceptions":["Debug logs get switched on in an incident, exactly when many people read them","Hiding a field in the display leaves it stored, backed up and searchable","","Encrypting the store still keeps a copy that serves no purpose"],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-logs","title":"Where should the national id stop?"},"level":null,"pool":"checkpoint"},{"id":"check-load-q1","type":"single","prompt":"A team load-tests the fraud-review service with 50 users, each sending the next request when the last answer arrives. The 95th percentile stays at 40 ms while the service's own histogram shows 400 ms in the same minute. What explains it?","options":[{"key":"A","text":"A closed load: users waited for slow answers, so fewer requests were sent and timed exactly when it slowed"},{"key":"B","text":"The network between the test and the service"},{"key":"C","text":"The test had no warm-up"},{"key":"D","text":"The histogram buckets are too wide"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"In a closed test the callers slow down with the service, so the slow period contributes few requests and the percentile looks good.","misconceptions":["","The histogram measures inside the service; network time would make the caller's numbers larger, not smaller","A warm-up affects the first seconds, not a whole minute","Buckets make the estimate coarse, not ten times wrong in the other direction"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-load","title":"What did this load test miss?"},"level":null,"pool":"checkpoint"},{"id":"check-sizing-q1","type":"single","prompt":"One replica of the fraud-review service holds its objective up to 60 requests a second. The target is 150 a second. The team plans 20% headroom and one spare replica. How many replicas does it need?","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"6"},{"key":"D","text":"3"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each replica is planned at 60 × 0.8 = 48 a second, so 150 / 48 = 3.1, rounded up to 4, plus one spare: 5.","misconceptions":["Forgets the headroom or the spare: either one alone gives 4","","Counts the headroom as an extra replica on top of the spare","Forgets both: 150 / 60 rounds up to 3, each replica at over 80% of capacity and nothing spare"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-sizing","title":"How many replicas?"},"level":null,"pool":"checkpoint"},{"id":"check-strategy-q1","type":"single","prompt":"The fraud team has a new model that changes which claims are referred to investigators. The head of the team will not let any claim be referred by it until she has seen a week of its decisions on real claims. What do you propose?","options":[{"key":"A","text":"A 10% canary for a week"},{"key":"B","text":"A rolling update with readiness probes"},{"key":"C","text":"A shadow release for a week: copy each request to it and keep only the current model's answer"},{"key":"D","text":"Blue-green with a switch back if anything looks wrong"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only shadow traffic shows the new model's decisions on real claims while no claim is decided by it.","misconceptions":["Even 10% of claims would be referred by the new model","A rolling update moves every claim to the new model within minutes","","Blue-green switches all traffic at once; the undo is fast but claims were referred"],"lo":["LO7"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-strategy","title":"Which release strategy?"},"level":null,"pool":"checkpoint"},{"id":"check-rollback-q1","type":"single","prompt":"At 02:10 a canary has served 350 requests. Errors and latency are normal, but its investigate share is 14 points above the current version's. Munira's criteria say more than 10 points means roll back. Munira is asleep. What should the engineer do?","options":[{"key":"A","text":"Set the canary's share to 0 now, then tell Munira with the evidence"},{"key":"B","text":"Wait for Munira to decide in the morning"},{"key":"C","text":"Keep the canary, since errors and latency are normal"},{"key":"D","text":"Find the cause first, then decide"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The criteria were written so that the person on call can act at once; the accountable person is told, with the evidence.","misconceptions":["","Waiting leaves claims triaged by a version that already broke a written criterion","The criterion is about the labels; healthy errors and latency do not cancel it","Diagnosing first keeps the faulty version serving while the cause is found"],"lo":["LO7"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-rollback","title":"What does the on-call engineer do now?"},"level":null,"pool":"checkpoint"},{"id":"check-drift-q1","type":"single","prompt":"In week 3, the region mix has a PSI of 0.02. Customer age has a KS p-value of 0.001 and a PSI of 0.03. The channel has a PSI of 0.31. Labels for week 3 arrive in two weeks. Which summary is right?","options":[{"key":"A","text":"Age and channel shifted; the model is degrading"},{"key":"B","text":"Channel shifted, so accuracy has fallen and the model must be retrained now"},{"key":"C","text":"Nothing shifted: two of three features are stable"},{"key":"D","text":"Channel shifted; age moved slightly and does not matter; accuracy is unknown until the labels arrive"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Name the large shift, set aside the significant but tiny move, and say what the missing labels leave open.","misconceptions":["A significant p-value with a tiny PSI is a small move, not a shift","Input drift says nothing yet about accuracy; that needs the labels","One feature far above the threshold is a shift, whatever the others do",""],"lo":["LO7"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-drift","title":"What should the drift report say?"},"level":null,"pool":"checkpoint"},{"id":"check-alerts-q1","type":"single","prompt":"An alert on the 95th-percentile latency uses a 30-second rate window and no for: duration. It fires for a minute about twice a day and resolves by itself. Callers never complain. What is the best first change?","options":[{"key":"A","text":"Raise the threshold to 300 ms"},{"key":"B","text":"Lengthen the window and add a for: duration, then test on a recording"},{"key":"C","text":"Send it to a wider group"},{"key":"D","text":"Delete the alert"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A short window and no duration react to blips; a longer window and a duration fire only on sustained breaches, which the recording can prove.","misconceptions":["The objective is the threshold; moving it hides real breaches","","An alert nobody acts on is worse than none, whoever receives it","Deleting it leaves sustained breaches unseen"],"lo":["LO5"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-alerts","title":"Why does this alert flap?"},"level":null,"pool":"checkpoint"},{"id":"q-path-registry","type":"single","prompt":"An auditor asks which model scored a disputed claim last March and whether it can be loaded today. Which component of the deployment path answers both questions?","options":[{"key":"A","text":"The container image, because it holds the model file"},{"key":"B","text":"The monitor, because it recorded every request"},{"key":"C","text":"The model registry, through the version named in the response"},{"key":"D","text":"The endpoint, because its path is /v1/"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each response names the model version, and the registry turns a version into its file, data hash and evidence.","misconceptions":["Images are rebuilt and retagged; the image says what ran only if it names a registered version","Metrics count requests; they do not store which artefact answered or how to load it","","The path carries the contract version, which stays the same across many model versions"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-path-runtime","type":"single","prompt":"In the path artefact, registry, image, runtime, endpoint, monitor: which component restarts the service when its process stops answering?","options":[{"key":"A","text":"The runtime, the cluster acting on the liveness probe"},{"key":"B","text":"The registry"},{"key":"C","text":"The image"},{"key":"D","text":"The monitor"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The cluster runs the image and acts on the probes: a failed liveness probe restarts the container.","misconceptions":["","The registry stores versions; it runs nothing","An image is a static package; it does nothing by itself","The monitor observes and alerts; it does not restart pods"],"lo":["LO1"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-path-monitor","type":"single","prompt":"Farz answers every request with status 200 and a fast latency, but its share of investigate labels has doubled since a release. Which component of the path should have shown this first?","options":[{"key":"A","text":"The image scan"},{"key":"B","text":"The endpoint, through its contract tests"},{"key":"C","text":"The registry, through the version metrics"},{"key":"D","text":"The monitor, through the prediction distribution panel"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Errors and latency can look healthy while predictions shift; only a metric of the predictions themselves shows it.","misconceptions":["A vulnerability scan says nothing about what the model predicts","Contract tests check shapes and types, not whether the labels make sense","Registered metrics describe the held-out set at registration, not live traffic",""],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-path-image","type":"single","prompt":"A colleague says the registry and the container image do the same job, since both store the model. What does the image add that the registry does not?","options":[{"key":"A","text":"The model version history"},{"key":"B","text":"The code, the libraries and the runtime settings that serve the model, in one package the cluster can run"},{"key":"C","text":"The training data"},{"key":"D","text":"The latency objective"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The registry answers which model; the image answers what runs it, so the cluster can start the same thing everywhere.","misconceptions":["The history lives in the registry; an image holds one build","","Neither the image nor the registry should ship the training data; the registry records its hash","The objective is written by the owner of the service, not stored in either"],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-path-order","type":"single","prompt":"A new Farz version is trained. In which order does it pass through the path before a claim is triaged by it?","options":[{"key":"A","text":"Image, registry, artefact, endpoint"},{"key":"B","text":"Registry, artefact, monitor, image"},{"key":"C","text":"Artefact, registry, image, runtime and endpoint, then the monitor watches it"},{"key":"D","text":"Endpoint, artefact, image, registry"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each box consumes the one before it, and the monitor watches the result in service.","misconceptions":["The artefact comes first: the image is built from a registered artefact","The monitor watches a running service; it is not a step before release","","The endpoint serves what the runtime runs; it is not where a model starts"],"lo":["LO1"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-artefact-pins","type":"single","prompt":"An artefact folder holds model.skops, signature.json and metadata.json. A fresh environment installs the newest scikit-learn and the reference predictions differ. What should the export have added?","options":[{"key":"A","text":"A requirements file with the exact versions that wrote the model"},{"key":"B","text":"A pickle copy of the model as a fallback"},{"key":"C","text":"A larger set of reference predictions"},{"key":"D","text":"The project lock file of the training repository"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The pins say which library versions load and reproduce the model; the clean-environment test proves them.","misconceptions":["","A second format does not fix which library version loads it","More references show the difference more clearly but do not prevent it","The project lock describes the whole project and every platform, not the minimum that loads this file; it works, but the artefact should state its own pins"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-artefact-pickle","type":"single","prompt":"A partner sends a model as a pickle file by email. You need it in Rifd's registry. What is the safe first step?","options":[{"key":"A","text":"Load it in the service and convert it there"},{"key":"B","text":"Rename it to .skops"},{"key":"C","text":"Register the pickle as it is; the registry checks the sha256"},{"key":"D","text":"Ask the partner to export it in a format that loads no code, or load it once in an isolated environment after reading what it imports"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A pickle is a program; it is loaded only from a trusted source, once, and saved again in a format that runs no code.","misconceptions":["Loading a pickle runs whatever it names, inside the service that holds personal data","The format is in the bytes, not in the name","A hash proves the file did not change, not that it is safe to load",""],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-registry-immutable","type":"single","prompt":"Production runs farz 1.0.0. A colleague finds a bug in the export (the decision rule was missing) and wants to fix the files of 1.0.0 in the registry. What should happen?","options":[{"key":"A","text":"Overwrite 1.0.0, since the model weights did not change"},{"key":"B","text":"Register the fixed export as a new version and release it"},{"key":"C","text":"Move the champion alias to the fixed folder"},{"key":"D","text":"Edit metadata.json in place, since only metadata changes"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A version is a promise that a name means one thing forever; a fix is a new version.","misconceptions":["The behaviour changed, so anything that cited 1.0.0 would now mean something else","","An alias pointing at an unregistered folder leaves no record of what the file is","The sha256 and every release record would silently stop matching"],"lo":["LO2"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-reference-predictions","type":"single","prompt":"Why does the Farz artefact store ten reference inputs with the predictions the notebook made for them?","options":[{"key":"A","text":"To give the API documentation examples"},{"key":"B","text":"To warm up the model for speed only"},{"key":"C","text":"To prove, in any environment, that the artefact behaves as the notebook did"},{"key":"D","text":"To measure the model's accuracy"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Matching all ten in a clean environment is the evidence that the export, pins and decision rule are complete.","misconceptions":["Examples help, but the check against expected labels is the purpose","The warm-up uses one of them, but the point is the comparison with the expected labels","","Ten claims say nothing about accuracy; they detect a change in behaviour"],"lo":["LO2"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-api-422-503","type":"single","prompt":"The claims system receives a 422 validation-error for one claim and a 503 model-unavailable for another. What should it do?","options":[{"key":"A","text":"Fix and resend the first; retry the second later or route it to manual triage"},{"key":"B","text":"Retry both after a delay"},{"key":"C","text":"Send both to manual triage"},{"key":"D","text":"Treat both as service failures and alert"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Typed errors tell the caller what to do: a validation error is fixed by the caller, an unavailable model is retried.","misconceptions":["","Retrying the 422 sends the same invalid claim again","The 422 points at a field to fix; manual triage hides the data problem","A 422 is the caller's error, not an outage"],"lo":["LO3"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-api-unknown-field","type":"single","prompt":"The contract lists no field called channel_detail, and a caller starts sending it. The schema uses extra=\"forbid\". What does the caller receive?","options":[{"key":"A","text":"200, with the field ignored"},{"key":"B","text":"500 prediction-failed"},{"key":"C","text":"400 with a plain text message"},{"key":"D","text":"422 validation-error naming channel_detail"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Unknown fields are refused with a validation error that names them, so the caller learns the field has no effect.","misconceptions":["That is extra=\"ignore\"; forbid refuses it","Validation happens before the model, so nothing fails inside the service","Every error of the contract is a problem detail with a type",""],"lo":["LO3"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-readyz-dependency","type":"single","prompt":"The policy lookup that some health claims need is down. Should Farz's /livez, /readyz, or neither, report it?","options":[{"key":"A","text":"/livez, so that the pod restarts"},{"key":"B","text":"Neither: answer the affected claims with dependency-failed and alert on its rate"},{"key":"C","text":"/readyz, so that every pod leaves the service"},{"key":"D","text":"Both, to be safe"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Readiness is about this pod being able to serve; a shared dependency is handled per request and by an alert.","misconceptions":["A restart cannot fix another system, and every pod would restart at once","","All pods share the dependency; removing them all stops triage for motor and property claims too","Both failing turns one missing dependency into a full outage and a restart loop"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-similar-endpoint","type":"single","prompt":"Shabih returns past claims similar to a description. Which response field would break the contract Bassam signed?","options":[{"key":"A","text":"claim_id of each neighbour"},{"key":"B","text":"the incident type of each neighbour"},{"key":"C","text":"the member name of each neighbour"},{"key":"D","text":"the similarity score"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The index keeps claim id, line and incident only; personal fields never enter the index or the answer.","misconceptions":["An internal identifier, needed to open the claim","A category, no personal data","","A number about the texts, no personal data"],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-docker-layer-order","type":"single","prompt":"A container file copies the whole project, then runs uv sync. Every code change reinstalls all dependencies. What fixes it?","options":[{"key":"A","text":"Copy pyproject.toml and uv.lock first, sync, then copy the code"},{"key":"B","text":"Use a larger base image with the libraries already in it"},{"key":"C","text":"Disable the build cache"},{"key":"D","text":"Install with pip instead of uv"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A layer is rebuilt when anything copied before it changes; copying the lock before the code keeps the dependency layer cached.","misconceptions":["","A larger base adds size and moves the problem to the base image's updates","That makes every build slower, not faster","The tool is not the problem; the layer order is"],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-docker-multistage","type":"single","prompt":"What does the second stage of Farz's multi-stage container file leave out that the naive file kept?","options":[{"key":"A","text":"The model files"},{"key":"B","text":"The non-root user"},{"key":"C","text":"The Python interpreter"},{"key":"D","text":"The build tools, the development dependencies and the files the service does not read"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The runtime stage copies only the virtual environment, the code and the models from the build stage.","misconceptions":["The runtime stage copies models/: the service needs them","The runtime stage adds the user; the naive file had none","Both stages are Python images; the runtime needs the interpreter",""],"lo":["LO4"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-scan-fix","type":"single","prompt":"A scan reports a critical finding in h11 0.14.0 with fixed version 0.16.0, and a medium finding in the base image with no fix available. What do you do first?","options":[{"key":"A","text":"Change the base image to a different distribution"},{"key":"B","text":"Raise the h11 pin to a fixed version, rebuild and scan again"},{"key":"C","text":"Ignore both, since the service is internal"},{"key":"D","text":"Suppress the critical finding in the scanner configuration"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Fix the most severe finding that has a fix, then rescan to prove it is gone.","misconceptions":["The medium finding has no fix yet; the critical one has a fix in reach","","An internal service still receives requests a proxy forwards; the advisory is about that path","Suppression hides the finding without changing what runs"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-secret-in-image","type":"single","prompt":"A container file sets ENV RIFD_LOOKUP_KEY=... in the image. After removing the line, the team rebuilds and pushes. Is the key still exposed?","options":[{"key":"A","text":"No, the line is gone"},{"key":"B","text":"Only if the registry is public"},{"key":"C","text":"Yes, in every earlier image that was pushed; the key must also be rotated"},{"key":"D","text":"Only in the build cache of the laptop"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A secret that reached an image is treated as leaked: remove it, rotate it, and supply the new one at run time.","misconceptions":["The new image is clean, but the old image and its layers still hold the key","Anyone who can pull the old image from any registry can read it","","The key is in the pushed image's configuration and history"],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-k8s-pull-policy","type":"single","prompt":"On a kind cluster, pods of rifd/claims:latest stay in ErrImagePull although the image was loaded into the cluster. What is the likely cause?","options":[{"key":"A","text":"imagePullPolicy Always with the tag latest makes the node pull from a registry that does not have the image"},{"key":"B","text":"The readiness probe path is wrong"},{"key":"C","text":"The memory limit is too low"},{"key":"D","text":"The Service selector does not match"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With latest the default policy is to pull every time; pin a tag and use IfNotPresent so the loaded image is used.","misconceptions":["","Probes run after the container starts; a pull error is earlier","A memory limit shows as an out-of-memory kill after start, not as a pull error","A selector mismatch leaves the Service empty; the pods still start"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-k8s-limits","type":"single","prompt":"A pod requests 256Mi of memory with a limit of 512Mi, and grows to 600Mi under load. What happens?","options":[{"key":"A","text":"Nothing, the request is only a hint"},{"key":"B","text":"It is throttled until memory falls"},{"key":"C","text":"The scheduler moves it to a bigger node"},{"key":"D","text":"The container is killed for exceeding its memory limit and restarted"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Memory above the limit gets the container killed; CPU above its limit is throttled.","misconceptions":["The request is used for scheduling; the limit is enforced","Throttling applies to CPU; memory over the limit is not slowed down","The scheduler places pods by requests at start; it does not move running pods",""],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-placement","type":"single","prompt":"Rifd classifies claims with personal and health data as Restricted and keeps Restricted data on in-Kingdom hosting. Where may the dashboards of request counts, latency and label shares run?","options":[{"key":"A","text":"Only beside Farz, because they describe Farz"},{"key":"B","text":"On the monitoring service outside the Kingdom, provided the metrics and logs sent there carry no personal data and Rifd's owners approve it"},{"key":"C","text":"Nowhere: dashboards are not allowed for Restricted services"},{"key":"D","text":"Anywhere, since metrics are never personal data"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Placement follows the classification of what is stored and sent; aggregate metrics without personal fields can be classified lower, by a decision someone signs.","misconceptions":["What decides placement is the data, not the service it describes","","Monitoring is needed; the question is what it carries","A label value or a log line can carry a national id; that is why redaction is tested"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-histogram-quantile","type":"single","prompt":"Farz has four replicas. Why does it record latency as a histogram rather than computing the 95th percentile in each process?","options":[{"key":"A","text":"Histograms are smaller to store"},{"key":"B","text":"A histogram gives the exact 95th percentile"},{"key":"C","text":"Bucket counts can be added across replicas, and the 95th percentile of the sum estimated; percentiles of each process cannot be averaged"},{"key":"D","text":"Prometheus cannot store numbers below one"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Percentiles do not aggregate; bucket counts do, which is why the histogram is the type for a service with replicas.","misconceptions":["Size is not the reason; summaries can be small too","It gives an estimate, interpolated inside the bucket","","Prometheus stores any floating-point number"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-buckets","type":"single","prompt":"Farz's latency objective is 150 ms. Its histogram buckets are 0.1, 0.5 and 1 second. What is the problem?","options":[{"key":"A","text":"No bucket boundary lies near 150 ms, so the estimated 95th percentile there is a straight-line guess between 100 and 500 ms"},{"key":"B","text":"There are too few buckets to store"},{"key":"C","text":"Buckets must be powers of two"},{"key":"D","text":"Histograms need a bucket at zero"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Put boundaries close to the objective so that the estimate is precise where the decision is made.","misconceptions":["","Fewer buckets are cheaper; the issue is where they are","Any increasing boundaries work","The first bucket counts everything up to its boundary, from zero"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-redaction-edge","type":"single","prompt":"Where should Farz remove the member's national id so that no log line or span carries it?","options":[{"key":"A","text":"In the dashboard query, by hiding the field"},{"key":"B","text":"In the log storage, with a retention rule"},{"key":"C","text":"In the claims system, by not sending it"},{"key":"D","text":"At the service edge: never pass it to the model, never log the claim body, and redact in the logger as a last defence"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Redact where the data enters, and test that nothing personal reaches the logs or traces.","misconceptions":["The data has already left the service and been stored","The id is stored until the rule runs, and copied wherever logs go","The contract accepts it, and other uses need it; Farz must still protect what it receives",""],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-trace-slow","type":"single","prompt":"A slow triage request shows a root span of 180 ms with two children: policy_lookup 121 ms and predict 1 ms. What should the team look at first?","options":[{"key":"A","text":"The model: switch to a faster algorithm"},{"key":"B","text":"The policy lookup: cache it, call it less, or set a budget"},{"key":"C","text":"The network between the caller and Farz"},{"key":"D","text":"The logging configuration"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A trace shows where one request spent its time; here the external lookup dominates.","misconceptions":["The prediction took one millisecond","","The root span is measured in the service, after the request arrived","Logging is not a span here, and nothing points to it"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-alert-for","type":"single","prompt":"An alert on the 95th-percentile latency fires for one minute every few hours and resolves by itself. The on-call engineer has stopped looking at it. What is the first change?","options":[{"key":"A","text":"Delete the alert"},{"key":"B","text":"Raise the threshold to twice the objective"},{"key":"C","text":"Add a for: duration and a longer rate window so that only a sustained breach fires"},{"key":"D","text":"Send it to more people"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"An alert should fire on what the caller feels for long enough to matter; a duration stops it flapping on short blips.","misconceptions":["The sustained rises it should catch would go unseen","The alert then misses real breaches of the objective","","More people ignoring it does not make it useful"],"lo":["LO5"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-dashboard-code","type":"single","prompt":"Why does Rifd keep its Farz dashboard as a JSON file in the repository rather than building it by hand in the tool?","options":[{"key":"A","text":"It is reviewed, versioned and recreated with the service, and its queries can be tested against the metrics the service exposes"},{"key":"B","text":"The dashboard loads faster"},{"key":"C","text":"Dashboards built by hand cannot show percentiles"},{"key":"D","text":"The tool requires it"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Dashboards as code change with the code they describe, through review, and can be checked automatically.","misconceptions":["","Speed is the same","They can; the problem is that nobody can review or restore them","Most tools allow both"],"lo":["LO5"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-open-load","type":"single","prompt":"A load test sends a new request only after the previous answer arrives. As the service slows down, what happens to the measured latency?","options":[{"key":"A","text":"It rises faithfully with the slowdown"},{"key":"B","text":"It cannot be measured"},{"key":"C","text":"It is identical to an open load"},{"key":"D","text":"It looks better than real traffic would see, because the test sends fewer requests when the service is slow"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Real callers do not wait for each other; an open load at a fixed rate shows the queue.","misconceptions":["A closed load sends less when the service slows, so it hides the queue a real caller would meet","It can; it is just biased","Open and closed loads differ exactly when the service slows",""],"lo":["LO6"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-one-claim-load","type":"single","prompt":"A load test sends the same motor claim 100 times a second and reports a 95th percentile of 9 ms. Live traffic shows 130 ms. What did the test miss?","options":[{"key":"A","text":"The warm-up"},{"key":"B","text":"The mix of claims: health claims outside the network call the slow policy lookup"},{"key":"C","text":"The network"},{"key":"D","text":"A bigger machine"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A load test must send the traffic the service will see; the slow path decides the 95th percentile.","misconceptions":["Warm-up affects the first seconds, not a steady 95th percentile","","The difference is the size of a dependency call, and it shows in the traces","The laptop was the same"],"lo":["LO6"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-sizing-headroom","type":"single","prompt":"One replica keeps the 95th percentile within the objective up to 150 requests a second. The target is 200, Rifd plans 30% headroom and one spare replica. How many replicas?","options":[{"key":"A","text":"2"},{"key":"B","text":"4"},{"key":"C","text":"3"},{"key":"D","text":"1"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"ceil(200 / (150 x 0.7)) = 2, plus one spare: 3.","misconceptions":["Two replicas would each run at 100, above 70% of 150; and there is no spare","That adds a second spare the plan does not ask for","","One replica breaks the objective at the target rate"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-cost-per-1000","type":"single","prompt":"Three replicas cost SAR 0.6075 an hour and carry 200 predictions a second. What is the cost of 1,000 predictions?","options":[{"key":"A","text":"About SAR 0.00084"},{"key":"B","text":"About SAR 0.0030"},{"key":"C","text":"About SAR 0.61"},{"key":"D","text":"About SAR 0.20"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"200 a second is 720,000 an hour; 0.6075 / 720 is about SAR 0.00084 per 1,000.","misconceptions":["","That divides by the predictions of one minute, not of one hour","That is the hourly cost, not the cost of 1,000 predictions","That divides the hourly cost by three replicas"],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-cpu-gpu","type":"single","prompt":"Farz predicts in about one millisecond on a processor. A colleague proposes one graphics-processor replica to cut latency. What does the evidence say?","options":[{"key":"A","text":"Do it: graphics processors are faster for every model"},{"key":"B","text":"Split the traffic between both"},{"key":"C","text":"Do it for the 99th percentile only"},{"key":"D","text":"Keep processors: the model is not the slow part, and the graphics replica costs far more per 1,000 predictions"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Measure where the time goes first; for a small tabular model a processor is cheaper and as fast.","misconceptions":["A logistic regression on ten features has little to parallelise","Two kinds of replica double the work without fixing the slow path","The tail comes from the policy lookup, not from the model",""],"lo":["LO6"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-canary-compare","type":"single","prompt":"A canary of farz 1.1.0 has served 160 requests with no errors and a slightly lower p95. Rifd's criteria say to judge only after 200 requests. What do you do?","options":[{"key":"A","text":"Promote now, the numbers look good"},{"key":"B","text":"Keep the canary at 10% until it has served at least 200 requests, then apply the criteria"},{"key":"C","text":"Roll back to be safe"},{"key":"D","text":"Raise the canary to 50% to finish faster"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Criteria written before the release say how much evidence is needed; wait for it.","misconceptions":["Below the minimum the numbers are too few to judge","","Nothing has fired; rolling back throws the evidence away","A larger share exposes more callers before any judgement"],"lo":["LO7"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-rollback-who","type":"single","prompt":"During a canary of farz 1.2.0 the investigate share rises from 19% to 41%. Who decides the rollback at Rifd, and who executes it?","options":[{"key":"A","text":"The data scientist decides and executes"},{"key":"B","text":"The cluster decides automatically"},{"key":"C","text":"Munira Al-Ajmi decides; the on-call engineer executes, and rolls back first when a written criterion fires"},{"key":"D","text":"The adjusters decide by vote"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The runbook names the accountable person; a written criterion lets the on-call engineer act first and report.","misconceptions":["Adel built the model; the runbook gives the decision to the business owner","Automation can execute; the runbook names a person accountable for the decision","","The criteria and the accountable person are written before the release"],"lo":["LO7"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"q-shadow","type":"single","prompt":"A new Farz version changes how claims are triaged. Munira wants evidence on real traffic before any claim is triaged by it. Which release strategy fits?","options":[{"key":"A","text":"A shadow release: copy every request to the new version and keep only the current version's answer"},{"key":"B","text":"A rolling update"},{"key":"C","text":"A canary at 10%"},{"key":"D","text":"Blue-green with an immediate switch"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Shadow traffic measures the new version on real requests without letting its answers reach anyone.","misconceptions":["","Every claim would be triaged by the new version within minutes","One claim in ten would be triaged by the new version","The switch sends all traffic to the new version at once"],"lo":["LO7"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-psi-vs-p","type":"single","prompt":"In week 3, policy tenure has a KS p-value of 0.04 and a PSI of 0.013, while the motor claim amounts have a PSI of 0.35. What should the drift report say?","options":[{"key":"A","text":"Both features shifted: both are significant"},{"key":"B","text":"Only tenure: it has the smaller p-value"},{"key":"C","text":"Neither: p-values above 0.01 mean no drift"},{"key":"D","text":"Tenure moved slightly and does not matter; motor amounts shifted"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A p-value says a move is not chance; the PSI says how large it is. Report the large shift and name the small one as negligible.","misconceptions":["With thousands of claims, a tiny move is significant; PSI shows its size","The motor amounts were not tested with that p-value; the PSI is large","The motor amounts move far beyond any threshold",""],"lo":["LO7"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-pooled-drift","type":"single","prompt":"Over all claims, the amount has a PSI of 0.06 in week 4. By line, motor amounts have 0.29, health and property under 0.04. What does this show?","options":[{"key":"A","text":"No drift, since 0.06 is below 0.1"},{"key":"B","text":"A shift in motor amounts that pooling over lines diluted"},{"key":"C","text":"A shift in every line"},{"key":"D","text":"A data error, since the numbers disagree"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Compute drift where the model's behaviour differs: by segment as well as overall.","misconceptions":["The pooled number hides a segment that shifted","","Health and property are stable","Both numbers are right; they describe different populations"],"lo":["LO7"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-delayed-labels","type":"single","prompt":"Labels for a claim arrive about two weeks after it is filed. In week 4, what can Rifd conclude about concept drift for weeks 3 and 4?","options":[{"key":"A","text":"That there is none, because accuracy in weeks 1 and 2 was stable"},{"key":"B","text":"That there is concept drift, because the inputs moved"},{"key":"C","text":"Nothing yet: the labels that would show it have not arrived; watch the inputs and predictions until they do"},{"key":"D","text":"That the model must be retrained now"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Data drift is visible at once; concept drift waits for labels. Say what is known and what is not.","misconceptions":["Weeks 1 and 2 came before the shift","Inputs can move while the relation between inputs and labels stays the same","","Retraining on unlabelled weeks is not possible, and the trigger needs evidence"],"lo":["LO7"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"}]}</script>
