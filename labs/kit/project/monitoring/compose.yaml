# Optional: real Prometheus and Grafana beside the service.
#   docker compose -f monitoring/compose.yaml up      (podman compose works the same)
# Grafana: http://localhost:3000 (admin / admin on first start). Prometheus: http://localhost:9090
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:13.2.6
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/farz.json:ro
    ports: ["3000:3000"]
