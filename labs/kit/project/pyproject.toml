[project]
name = "rifd-claims"
version = "1.0.0"
description = "Rifd Mutual Insurance claims services: Farz (triage) and Shabih (similar claims). Lab project of the SDAIA Academy course AE-205."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "h11>=0.16",
    "pydantic>=2.12",
    "numpy>=2.2",
    "scikit-learn>=1.8",
    "skops>=0.16",
    "prometheus-client>=0.25",
    "structlog>=25.4",
    "opentelemetry-sdk>=1.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
    "locust>=2.40",
    "psutil>=7.0",
    "scipy>=1.15",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rifd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx`"]
