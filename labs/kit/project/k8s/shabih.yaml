# Shabih, the similar-claims service: its own deployment, because its memory and start-up differ (lab 2.4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shabih
  labels: {app: shabih, app.kubernetes.io/part-of: rifd-claims}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shabih}
  template:
    metadata:
      labels: {app: shabih, version: "1.0.0"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: shabih
          image: rifd/claims:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: RIFD_SERVICE, value: shabih}
            - {name: RIFD_SIMILAR_DIR, value: /app/models/shabih-1.0.0}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shabih
spec:
  selector: {app: shabih}
  ports: [{port: 80, targetPort: http, name: http}]
