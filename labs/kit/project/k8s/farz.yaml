# Farz, the claims-triage service, on a single-node cluster (kind, k3d or minikube).
#   kind load docker-image rifd/claims:1.0.0 --name rifd
#   kubectl apply -f k8s/config.yaml -f k8s/farz.yaml
#   kubectl rollout status deployment/farz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farz
  labels: {app: farz, app.kubernetes.io/part-of: rifd-claims}
spec:
  replicas: 2
  selector:
    matchLabels: {app: farz}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: farz, version: "1.0.0"}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: farz
          image: rifd/claims:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          env:
            - {name: RIFD_SERVICE, value: farz}
            - {name: RIFD_MODEL_DIR, value: /app/models/farz-1.0.0}
            - name: RIFD_LOOKUP_KEY
              valueFrom:
                secretKeyRef: {name: rifd-lookup, key: key}
          envFrom:
            - configMapRef: {name: rifd-config}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: farz
  labels: {app: farz}
spec:
  selector: {app: farz}
  ports: [{port: 80, targetPort: http, name: http}]
